# Deploys every Supabase edge function on a push to main.
#
# Why this exists: deploying by hand meant deploying each function with its
# full transitive _shared closure, one at a time. Miss one file and the
# function boots with "Module not found"; miss one function and it quietly
# keeps running last week's code. Both happened. The live worker-pdf-render
# ran a version with no brand support for days while the repo had it, and
# nothing anywhere said so -- a stale deploy looks exactly like a working one
# until a deliverable comes back wrong.
#
# The CLI already computes the dependency closure correctly, so the honest
# fix is to stop doing it by hand.
#
# Setup (once): add a repository secret SUPABASE_ACCESS_TOKEN, generated at
# https://supabase.com/dashboard/account/tokens. The project ref below is not
# a secret -- it is already in the client bundle.

name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      # config.toml decides each function's verify_jwt and which functions the
      # CLI tries to deploy at all, so a change to it must trigger a deploy --
      # leaving it out meant a fix to it silently ran nothing.
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # No --no-verify-jwt here: each function's own setting is kept as
          # configured in the dashboard. Deploying them together means the
          # shared modules can never be live in two different versions.
          supabase functions deploy --project-ref vuutmxrunxkjydcryeoa
