# Deploys every Supabase edge function on a push to main.
#
# Why this exists: deploying by hand meant deploying each function with its
# full transitive _shared closure, one at a time. Miss one file and the
# function boots with "Module not found"; miss one function and it quietly
# keeps running last week's code. Both happened. The live worker-pdf-render
# ran a version with no brand support for days while the repo had it, and
# nothing anywhere said so -- a stale deploy looks exactly like a working one
# until a deliverable comes back wrong.
#
# The CLI already computes the dependency closure correctly, so the honest
# fix is to stop doing it by hand.
#
# Setup (once): add a repository secret SUPABASE_ACCESS_TOKEN, generated at
# https://supabase.com/dashboard/account/tokens. The project ref below is not
# a secret -- it is already in the client bundle.

name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      # config.toml decides each function's verify_jwt and which functions the
      # CLI tries to deploy at all, so a change to it must trigger a deploy --
      # leaving it out meant a fix to it silently ran nothing.
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Nothing ran before deploying. That made "the compiler will catch
      # it" an empty claim: the required excludedAgents field was missing
      # from a test fixture and a sweep returned a key its own type did not
      # allow, and both shipped. A deploy that cannot fail is not a check.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # config.toml names the functions the CLI deploys. Deleting a
      # function's directory without deleting its entry here fails the
      # deploy step -- after the type-check and the whole test suite have
      # already passed, which reads as "the code is fine but shipping is
      # broken" and sends you looking in the wrong place. Three seconds
      # here answers it directly.
      - name: Check config.toml matches the functions on disk
        run: |
          missing=0
          for fn in $(grep -oP '(?<=^\[functions\.)[^]]+' supabase/config.toml); do
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "::error::config.toml declares [functions.$fn] but supabase/functions/$fn does not exist."
              missing=1
            fi
          done
          exit $missing

      # The entrypoints pull in every _shared module they use, so this
      # covers the whole deployed surface. The *.test.ts files are
      # deliberately excluded: they run under Node, so Deno is the wrong
      # compiler to judge them by -- the test step below is their check.
      #
      # No import map here: CI can reach esm.sh, so this checks against the
      # real published types. typecheck-map.json in the repo root points the
      # same three remote imports at node_modules copies, for checking from
      # an environment whose egress policy blocks esm.sh:
      #
      #   npm i --no-save @anthropic-ai/sdk@0.125.0 qrcode-generator@1.4.4
      #   deno check --import-map=typecheck-map.json --no-remote \
      #     supabase/functions/*/index.ts
      - name: Type-check the functions
        run: deno check supabase/functions/*/index.ts

      - name: Run the tests
        run: |
          failed=0
          for test in supabase/functions/_shared/*.test.ts; do
            echo "--- $test"
            node --experimental-strip-types "$test" || failed=1
          done
          exit $failed

      - name: Deploy all functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # No --no-verify-jwt here: each function's own setting is kept as
          # configured in the dashboard. Deploying them together means the
          # shared modules can never be live in two different versions.
          supabase functions deploy --project-ref vuutmxrunxkjydcryeoa
