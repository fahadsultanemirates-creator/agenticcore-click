[build]
  command = "npm run build"
  publish = "dist"

# Real app routes get the app shell with 200. Prerendered pages (terms,
# privacy, contact, refunds) are matched by their own file first.
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/reset"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/claim"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/refunds"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/projects/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Anything else is not a page: the app shell renders its not-found screen,
# served with a real 404 so unknown URLs are not indexed as the homepage.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Maya's voice notes need the microphone on this site only.
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=(), usb=()"
