# Per-function JWT settings.
#
# The platform defaults verify_jwt to true, and the CLI applies this file on
# every deploy -- so any function that must run without a Supabase JWT has to
# be listed here explicitly. Eight functions were live with verify_jwt = false
# while only two of them appeared in this file, which meant the first bulk
# `supabase functions deploy` would have silently re-gated the other six.
# Every current setting is therefore recorded below, whether or not it was
# set here originally.

# Called by pg_cron through pg_net with the anon key, and by the billing
# page with a real session. It resolves and checks the caller itself for
# the single-invoice path.
[functions.usdt-check]
verify_jwt = false

[functions.usdt-invoice]
verify_jwt = false

# Called by pg_cron through pg_net with the anon key, and nudged by the
# workers that queue mail. It takes no input at all -- it only ever drains
# rows that something already wrote to email_outbox -- so there is nothing
# an untrusted caller could make it send.
[functions.send-email]
verify_jwt = false

# Called by pg_cron through pg_net. Takes no input -- it only ever acts on
# accounts that are already past their deadline.
[functions.telegram-sweep]
verify_jwt = false

# The caller has no session yet; obtaining one is the entire point. The
# code is the credential, checked as a hash against a single-use row, and
# every failure returns the same message so the endpoint cannot be used to
# ask which addresses have accounts.
[functions.telegram-claim]
verify_jwt = false

# telegram-webhook is authenticated via X-Telegram-Bot-Api-Secret-Token,
# not a Supabase JWT -- Telegram never sends one.
[functions.telegram-webhook]
verify_jwt = false

# Called by pg_cron through pg_net, and chained from itself and from the
# submit paths, with the service role key -- not a user session.
[functions.dispatcher]
verify_jwt = false

# Invoked by the dispatcher, not by a browser.
[functions.worker-image]
verify_jwt = false

# Browser-called, and each one resolves and checks the caller itself from the
# Authorization header before doing anything (see resolveCaller in each).
[functions.submit-task]
verify_jwt = false

[functions.forge-submit]
verify_jwt = false

[functions.forge-upload]
verify_jwt = false

[functions.forge-transcribe]
verify_jwt = false

# grokbot-callback is called by Grok Bot, which holds no Supabase JWT by
# design. It authenticates every request itself with a per-job token and an
# HMAC signature over the body and timestamp -- see _shared/hmac.ts.
[functions.grokbot-callback]
verify_jwt = false

# worker-grokbot is NOT listed, deliberately. It keeps the platform's JWT
# gate AND checks requireInternalCaller on top, because verify_jwt alone
# accepts the anon key, which ships in the browser bundle.

# webhook-diag and voice-diag are deliberately NOT listed here. They are live
# on the project with verify_jwt = false but have no source in this repo --
# they were deployed by hand during setup and never committed. The CLI tries
# to deploy every function named in this file, so listing them fails the whole
# run on a missing directory. Left unlisted, they keep running untouched.
#
# They are unauthenticated endpoints nobody is maintaining; worth deleting
# from the project once they are confirmed unused.

# The visit beacon. Public by necessity: most visitors have no account,
# and the ones worth counting are the people deciding whether to open
# one. It takes a path and a referrer and nothing else -- who the visitor
# is comes from the request's own headers, server-side.
[functions.track-visit]
verify_jwt = false
